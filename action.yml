name: "mcpprobe MCP security scan"
description: "Passive security scan of an MCP server you own: auth, transport, tool poisoning and metadata checks, with SARIF for code scanning."
author: "mcpprobe contributors"
branding:
  icon: "shield"
  color: "green"

inputs:
  target:
    description: "MCP endpoint URL to scan (Streamable HTTP). Only scan servers you own or are authorised to test."
    required: true
  fail-on:
    description: "Fail the step when a finding is at or above this severity: info, low, medium, high, critical."
    required: false
    default: "high"
  rate:
    description: "Maximum requests per second (1-10)."
    required: false
    default: "5"
  sarif-output:
    description: "Path of the SARIF 2.1.0 file to write (relative to the workspace)."
    required: false
    default: "mcpprobe.sarif"
  sarif-location:
    description: "Repository file to anchor SARIF results to (e.g. your server entry point). Defaults to the target URL."
    required: false
    default: ""
  json-output:
    description: "Optional path of the full JSON report (includes evidence)."
    required: false
    default: ""
  baseline:
    description: "Optional META-02 baseline file to compare against (rug-pull detection)."
    required: false
    default: ""
  headers:
    description: "Extra HTTP headers, one 'Name: value' per line (for example a test bearer token from secrets)."
    required: false
    default: ""
  extra-args:
    description: "Additional mcpprobe scan arguments."
    required: false
    default: ""

outputs:
  sarif-file:
    description: "Path of the SARIF file that was written."
  exit-code:
    description: "mcpprobe exit code: 0 clean, 1 findings at or above fail-on, 2 error/opt-out."

runs:
  using: "docker"
  image: "Dockerfile"
