name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, type-check and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" jsonschema
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Pytest
        run: pytest -q

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install wheel into a fresh venv and scan the fake server
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/mcpprobe --help
          python -m tests.fake_server --preset vulnerable --port 8765 &
          sleep 1
          set +e
          /tmp/venv/bin/mcpprobe http://127.0.0.1:8765/mcp --sarif smoke.sarif
          code=$?
          set -e
          test "$code" = "1"   # the fake server is deliberately vulnerable
          test -s smoke.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker-action:
    name: build the action image and scan the fake server
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build image
        run: docker build -t mcpprobe-action:ci .
      - name: Run image against the fake server
        run: |
          python -m tests.fake_server --preset vulnerable --port 8765 &
          sleep 1
          set +e
          docker run --rm --network host -v "$PWD:/github/workspace" -w /github/workspace \
            -e INPUT_TARGET=http://127.0.0.1:8765/mcp -e INPUT_SARIF-OUTPUT=action.sarif \
            mcpprobe-action:ci
          code=$?
          set -e
          test "$code" = "1"
          test -s action.sarif
